name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets, no network egress to Last.fm. This workflow only verifies the
# deterministic unit tests, typecheck, and a clean build of the published
# entrypoints. Live integration is intentionally excluded and lives in a
# separate workflow (see docs/CD.md) gated by a protected environment.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: bun.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test:unit

      - name: Clean build
        run: bun run build

      - name: Smoke-test published import paths
        run: |
          node --input-type=module -e "
          (async () => {
            await import('./dist/index.js');
            await import('./dist/entrypoints/artist.js');
            await import('./dist/entrypoints/track.js');
            await import('./dist/entrypoints/artist.schemas.js');
            await import('./dist/entrypoints/track.schemas.js');
            console.log('smoke: ok');
          })().catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Verify no test files in dist
        run: |
          if find dist -name '*.test.*' -o -name '__tests__' -type d | grep -q .; then
            echo "ERROR: dist contains test artifacts that should be excluded by tsconfig."
            find dist -name '*.test.*' -o -name '__tests__' -type d
            exit 1
          fi
