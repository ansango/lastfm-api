name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default GITHUB_TOKEN is read-only on most personal repos. The
# "Post test summary to PR" step needs to POST issue comments, so we
# opt in to write on pull-requests + issues. `contents: read` is the
# default for checkout and stays read-only.
permissions:
  contents: read
  pull-requests: write
  issues: write

# No secrets, no network egress to Last.fm. This workflow only verifies the
# deterministic unit tests, typecheck, and a clean build of the published
# entrypoints. Live integration is intentionally excluded and lives in a
# separate workflow (see docs/CD.md) gated by a protected environment.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: bun.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install tool dependencies (#92)
        run: bun install --cwd tool/api-scalar --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck tool (#92)
        run: bun run --cwd tool/api-scalar typecheck

      - name: Lint (Biome)
        # Catches formatting drift, unused imports, suspicious patterns. Biome
        # covers both `src/`, `tool/`, and `scripts/` from the root config.
        run: bun run lint

      - name: Run unit tests
        id: tests
        # Capture both the streamed output (for parsing into the PR summary)
        # and the exit code. `tee` lets the step fail naturally if tests fail.
        run: |
          set +e
          bun test src/__tests__ 2>&1 | tee test-output.log
          echo "exit=${PIPESTATUS[0]}" > tests.exit
        # Re-implement the failure check so the step still fails on test errors.
      - name: Assert tests passed
        if: always()
        run: |
          exit_code=$(cat tests.exit | sed 's/exit=//')
          if [ "$exit_code" != "0" ]; then
            echo "Tests failed (exit code $exit_code)"
            exit "$exit_code"
          fi

      - name: Run tool tests (#92)
        run: bun run --cwd tool/api-scalar test

      - name: Post test summary to PR
        if: github.event_name == 'pull_request' && always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun tool/ci-summary.ts

      - name: Clean build
        run: bun run build

      - name: Smoke-test published import paths
        run: |
          node --input-type=module -e "
          (async () => {
            await import('./dist/index.js');
            await import('./dist/entrypoints/artist.js');
            await import('./dist/entrypoints/track.js');
            await import('./dist/entrypoints/insights.js');
            await import('./dist/entrypoints/artist.schemas.js');
            await import('./dist/entrypoints/track.schemas.js');
            await import('./dist/entrypoints/insights.schemas.js');
            console.log('smoke: ok');
          })().catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Verify no test files in dist
        run: |
          if find dist -name '*.test.*' -o -name '__tests__' -type d | grep -q .; then
            echo "ERROR: dist contains test artifacts that should be excluded by tsconfig."
            find dist -name '*.test.*' -o -name '__tests__' -type d
            exit 1
          fi
